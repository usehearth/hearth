# Every push and pull request: typecheck, unit tests and the web build.
name: CI
on:
  push:
    branches: [main, app-track, parity]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
