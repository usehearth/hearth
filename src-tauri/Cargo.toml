[package]
name = "hearth"
version = "0.1.0"
description = "Your AI, at home. A server-first chat app for any ACP agent."
license = "Apache-2.0"
edition = "2021"

[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Self-update from GitHub releases (signed). Local builds leave it off, so they need no signing key.
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
# Release builds only (cargo feature "updater", see tauri.release.conf.json and .github/workflows/release.yml).
tauri-plugin-updater = { version = "=2.14.1", optional = true }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
